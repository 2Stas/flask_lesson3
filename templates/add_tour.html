{% extends "base.html" %}

{% block title %}Додати тур - Туристична агенція{% endblock %}

{% block content %}
    <h1>Додати тур</h1>

    <div id="form-error" class="error-message"></div>

    <form id="add-tour-form" method="POST" action="{{ url_for('add_tour') }}">
        <div class="form-group">
            <label for="title">Назва:</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="description">Опис:</label>
            <textarea class="form-control" id="description" name="description" required></textarea>
        </div>
        <div class="form-group">
            <label for="price">Ціна:</label>
            <input type="number" class="form-control" id="price" name="price" step="0.01" required>
        </div>
        <div class="form-group">
            <label for="image_url">Назва файлу фото:</label>
            <input type="text" class="form-control" id="image_url" name="image_url" placeholder="наприклад: beach.jpg">
        </div>
        <button type="submit" class="btn btn-primary">Додати тур</button>
    </form>
{% endblock %}
